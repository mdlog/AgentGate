# AgentGate on-chain registry (SPEC §10).
#
# Layout follows the `cargo odra new --template full` conventions for Odra 2.7.x:
# one crate, `Odra.toml` listing the deployable contract, and the
# `*_build_contract` / `*_build_schema` bins that `cargo odra build` /
# `cargo odra schema` drive.
#
# NOTE on the Odra version: the `2.7.2` requirement below is a caret range, so
# Cargo.lock currently resolves odra-core 2.8.1 (the prebuilt wasm is built
# against 2.8.1). The sibling spend-guard crate exact-pins `=2.7.2`. This drift
# is immaterial to AgentGate: the module-state dictionary-key codec
# (ContractEnv::index_bytes / current_key, used by packages/chain/src/live.ts)
# is byte-identical across 2.7.2 and 2.8.1. To remove the drift, exact-pin both
# crates to the same version and regenerate the lockfiles at deploy time.
# `odra-test` MUST track the same version as `odra`.

[package]
name = "agentgate-registry"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "AgentGateRegistry — service discovery + payment attestation reputation for AI-agent APIs on Casper (Odra)."

[dependencies]
odra = { version = "2.7.2", features = [], default-features = false }

[dev-dependencies]
odra-test = { version = "2.7.2", features = [], default-features = false }

[build-dependencies]
odra-build = { version = "2.7.2", features = [], default-features = false }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
odra-build = { version = "2.7.2", features = [], default-features = false }
# Livenet deploy tooling — only pulled in by `--features livenet` (see bin/deploy.rs).
odra-cli = { version = "2.7.2", features = [], default-features = false, optional = true }

[features]
# Enables the documented testnet deploy binary (bin/deploy.rs). NOT part of the
# default build/test flow; see ../README.md "Testnet deploy runbook".
livenet = ["dep:odra-cli"]

# Bin names must be `<crate name with - replaced by _>_build_{contract,schema}`
# — cargo-odra 0.1.7 derives them from the package name.
[[bin]]
name = "agentgate_registry_build_contract"
path = "bin/build_contract.rs"
test = false

[[bin]]
name = "agentgate_registry_build_schema"
path = "bin/build_schema.rs"
test = false

[[bin]]
name = "agentgate_registry_deploy"
path = "bin/deploy.rs"
test = false
required-features = ["livenet"]

# Odra-recommended release profile for small WASM artifacts.
[profile.release]
codegen-units = 1
lto = true

# Speed up OdraVM test runs (template default).
[profile.dev.package."*"]
opt-level = 3
